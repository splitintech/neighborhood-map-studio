name: Map Studio release image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: vars.IMAGE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/splitintech/neighborhood-map-studio:${{ github.sha }}
      - name: Record immutable artifact
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/splitintech/neighborhood-map-studio@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
